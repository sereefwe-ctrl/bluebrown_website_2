<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlueBrown Partners</title>
  <link rel="icon" type="image/png" href="Images/123.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet" />
  <style>
    /* The Stealth Fund hero, on its own: one rounded glass panel filling
       the screen with the logo in the middle, over slow coloured light
       and live film grain. */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gap: clamp(14px, 2.2vw, 44px);
      --radius: clamp(14px, 1.4vw, 28px);
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0e0e0d;
      overflow: hidden;
    }

    /* Slow-moving light behind the glass so the panel has something to blur. */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient span {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      will-change: transform;
    }

    .ambient .a {
      top: -25vmax;
      left: -20vmax;
      background: radial-gradient(circle, rgba(159, 180, 230, 0.32), transparent 65%);
      animation: drift-a 38s ease-in-out infinite alternate;
    }

    .ambient .b {
      bottom: -30vmax;
      right: -25vmax;
      background: radial-gradient(circle, rgba(232, 162, 124, 0.26), transparent 65%);
      animation: drift-b 46s ease-in-out infinite alternate;
    }

    .ambient .c {
      top: 30%;
      left: 35%;
      width: 45vmax;
      height: 45vmax;
      background: radial-gradient(circle, rgba(255, 200, 87, 0.12), transparent 65%);
      animation: drift-c 54s ease-in-out infinite alternate;
    }

    @keyframes drift-a { to { transform: translate(30vw, 25vh) scale(1.15); } }
    @keyframes drift-b { to { transform: translate(-35vw, -30vh) scale(0.9); } }
    @keyframes drift-c { to { transform: translate(-25vw, 20vh) scale(1.3); } }

    main {
      padding: var(--gap);
    }

    /* Frosted-glass panel with a soft highlight that follows the pointer. */
    .tile {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015) 55%, rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 30px 60px -40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, 0.08), transparent 60%);
    }

    .tile:hover::before {
      opacity: 1;
    }

    .hero {
      height: calc(100vh - 2 * var(--gap));
      height: calc(100svh - 2 * var(--gap));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Star mark + wordmark, laid out with the original logo's proportions
       (star 194px, gap 55px, text 923px of 1172px). */
    .hero-logo {
      position: relative;
      width: min(640px, 70%);
      display: flex;
      align-items: center;
      gap: 4.69%;
      user-select: none;
    }

    .hero-logo img {
      display: block;
      height: auto;
    }

    .logo-star {
      width: 16.55%;
    }

    .logo-text {
      width: 78.75%;
    }

    /* Fine print in the panel's bottom-left corner, set like the Stealth
       Fund site's: small spaced capitals in a muted cream. */
    .legal {
      position: absolute;
      left: clamp(16px, 2.2vw, 40px);
      bottom: clamp(16px, 2vw, 36px);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: max(10px, 0.82vw);
      line-height: 1.6;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244, 241, 232, 0.4);
    }

    /* Access gate: opens when someone tries to scroll past the hero. A
       dark frosted card over a blurred backdrop, with the Stealth Fund
       mark, a code field and a soft cream button, in the hero's palette. */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: var(--gap);
      background: rgba(8, 8, 8, 0.45);
      backdrop-filter: blur(14px) saturate(120%);
      -webkit-backdrop-filter: blur(14px) saturate(120%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, visibility 0s linear 0.45s;
    }

    .gate.is-open {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.45s ease;
    }

    .gate-card {
      width: min(400px, 100%);
      padding: clamp(28px, 3vw, 40px);
      border-radius: calc(var(--radius) * 1.1);
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03) 55%, rgba(255, 255, 255, 0.05)),
        rgba(22, 22, 21, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        0 40px 80px -30px rgba(0, 0, 0, 0.85);
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gate.is-open .gate-card {
      transform: none;
    }

    .gate-card {
      position: relative;
    }

    /* Back button in the card's top-left corner: the site's curved-barb
       arrow, pointing left, in a small glass square. */
    .gate-back {
      position: absolute;
      top: 16px;
      left: 16px;
      display: grid;
      place-items: center;
      width: 38px;
      aspect-ratio: 1;
      padding: 0;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(244, 241, 232, 0.85);
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .gate-back svg {
      width: 18px;
      height: auto;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .gate-back:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      color: #f4f1e8;
    }

    .gate-back:hover svg {
      transform: translateX(-3px);
    }

    .gate-back:focus-visible {
      outline: 2px solid rgba(244, 241, 232, 0.6);
      outline-offset: 3px;
    }

    .gate-card.is-wrong {
      animation: gate-shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }

    @keyframes gate-shake {
      20% { transform: translateX(-8px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(3px); }
    }

    /* Same star + wordmark proportions as the hero logo. */
    .gate-logo {
      display: flex;
      align-items: center;
      gap: 4.69%;
      width: 172px;
      margin: 0 auto 26px;
    }

    .gate-logo img {
      display: block;
      height: auto;
    }

    .gate-logo .logo-star { width: 16.55%; }
    .gate-logo .logo-text { width: 78.75%; }

    .gate-title {
      font-family: 'Newsreader', 'Times New Roman', serif;
      font-weight: 400;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: rgba(244, 241, 232, 0.96);
    }

    .gate-copy {
      margin-top: 10px;
      font-size: 14.5px;
      line-height: 1.5;
      color: rgba(244, 241, 232, 0.55);
    }

    .gate-form {
      margin-top: 28px;
      text-align: left;
    }

    .gate-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(244, 241, 232, 0.8);
    }

    .gate-input {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
      font: inherit;
      font-size: 15px;
      color: rgba(244, 241, 232, 0.96);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .gate-input::placeholder {
      color: rgba(244, 241, 232, 0.35);
    }

    .gate-input:focus {
      border-color: rgba(244, 241, 232, 0.45);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(244, 241, 232, 0.08);
    }

    .gate-card.is-wrong .gate-input {
      border-color: rgba(232, 162, 124, 0.7);
    }

    .gate-button {
      display: block;
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #d9d5cc;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      color: #0e0e0d;
      cursor: pointer;
      transition: background-color 0.25s ease, transform 0.15s ease;
    }

    .gate-button:hover { background: #e8e4db; }
    .gate-button:active { transform: scale(0.99); }

    .gate-button:focus-visible {
      outline: 2px solid rgba(244, 241, 232, 0.6);
      outline-offset: 3px;
    }

    .gate-card.is-granted .gate-button {
      background: #f4f1e8;
    }

    .gate-error {
      min-height: 18px;
      margin-top: 10px;
      font-size: 13px;
      color: #e8a27c;
    }

    /* Live film grain, redrawn by the script below. */
    .grain {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.11;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient span,
      .gate-card.is-wrong {
        animation: none;
      }

      .gate,
      .gate-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

  <main>
    <section class="tile hero">
      <div class="hero-logo" role="img" aria-label="Stealth Fund">
        <img class="logo-star" src="stealth/logo-star.png" alt="" />
        <img class="logo-text" src="stealth/logo-text.png" alt="" />
      </div>
      <p class="legal">© 2026 BlueBrown Partners LLC. All rights reserved.<br />Stealth Fund™ is a trademark of its respective owner.</p>
    </section>
  </main>

  <div class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" aria-describedby="gate-copy">
    <div class="gate-card">
      <button class="gate-back" type="button" aria-label="Go back" data-cursor-label="back">
        <svg viewBox="0 0 46 32" fill="none" stroke="currentColor" stroke-width="3.6" aria-hidden="true"><path d="M2 16H46"></path><path d="M16 0C16 9 10 16 2 16C10 16 16 23 16 32"></path></svg>
      </button>
      <div class="gate-logo" role="img" aria-label="Stealth Fund">
        <img class="logo-star" src="stealth/logo-star.png" alt="" />
        <img class="logo-text" src="stealth/logo-text.png" alt="" />
      </div>
      <h2 class="gate-title" id="gate-title">Access Restricted</h2>
      <p class="gate-copy" id="gate-copy">To gain access to this doc,<br />provide your access code below.</p>
      <form class="gate-form" novalidate>
        <label class="gate-label" for="gate-code">Enter access code</label>
        <input class="gate-input" id="gate-code" type="password" placeholder="Your access code..." autocomplete="off" spellcheck="false" />
        <button class="gate-button" type="submit" data-cursor-label="access">Access</button>
        <p class="gate-error" role="alert"></p>
      </form>
    </div>
  </div>

  <canvas class="grain" aria-hidden="true"></canvas>

  <script>
    // Live film grain: a few pre-rendered noise tiles, shown at a random
    // offset ~14 times a second so the grain flickers like film.
    (function () {
      var canvas = document.querySelector('.grain');
      var ctx = canvas.getContext('2d');
      var TILE = 180;
      var tiles = [];

      for (var t = 0; t < 6; t++) {
        var c = document.createElement('canvas');
        c.width = c.height = TILE;
        var cx = c.getContext('2d');
        var img = cx.createImageData(TILE, TILE);
        for (var i = 0; i < img.data.length; i += 4) {
          var v = (Math.random() * 255) | 0;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        cx.putImageData(img, 0, 0);
        tiles.push(ctx.createPattern(c, 'repeat'));
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        draw();
      }

      function draw() {
        var p = tiles[(Math.random() * tiles.length) | 0];
        var ox = (Math.random() * TILE) | 0, oy = (Math.random() * TILE) | 0;
        ctx.setTransform(1, 0, 0, 1, -ox, -oy);
        ctx.fillStyle = p;
        ctx.fillRect(ox, oy, canvas.width, canvas.height);
      }

      resize();
      window.addEventListener('resize', resize);

      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setInterval(draw, 70);
    })();

    // Access gate: it slides in 2.5 seconds after the home screen shows,
    // and the back button in its corner is the only way out; back on the
    // home screen, it returns 2.5 seconds later. The code is checked
    // against its SHA-256 hash, so it is not written into the page; a
    // correct code goes on to the full Stealth Fund site.
    (function () {
      var CODE_HASH = '9ef3dcb6596b7d606b713995e48696d89da3c01f4300563f85d15e20a2541a4e';
      var UNLOCK_URL = 'https://stealth-fund.vercel.app/';
      var DELAY = 2500;
      var gate = document.querySelector('.gate');
      var card = gate.querySelector('.gate-card');
      var form = gate.querySelector('.gate-form');
      var input = gate.querySelector('.gate-input');
      var button = gate.querySelector('.gate-button');
      var back = gate.querySelector('.gate-back');
      var error = gate.querySelector('.gate-error');
      var busy = false, timer = null;

      function open() {
        if (gate.classList.contains('is-open')) return;
        gate.classList.add('is-open');
        setTimeout(function () { input.focus({ preventScroll: true }); }, 60);
      }

      function close() {
        gate.classList.remove('is-open');
        input.blur();
        input.value = '';
        error.textContent = '';
        card.classList.remove('is-wrong');
        later();
      }

      function later() {
        clearTimeout(timer);
        timer = setTimeout(open, DELAY);
      }

      back.addEventListener('click', function () {
        if (!busy) close();
      });

      later();

      function sha256(text) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
          return Array.prototype.map.call(new Uint8Array(buf), function (b) {
            return ('0' + b.toString(16)).slice(-2);
          }).join('');
        });
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (busy) return;
        var value = input.value.trim();
        if (!value) { input.focus(); return; }
        busy = true;
        sha256(value).then(function (hash) {
          if (hash === CODE_HASH) {
            card.classList.add('is-granted');
            error.textContent = '';
            button.textContent = 'Access granted';
            setTimeout(function () { window.location.href = UNLOCK_URL; }, 650);
            return;
          }
          busy = false;
          error.textContent = 'That code doesn\u2019t match. Please try again.';
          card.classList.remove('is-wrong');
          void card.offsetWidth;
          card.classList.add('is-wrong');
          input.select();
        });
      });

      input.addEventListener('input', function () {
        error.textContent = '';
        card.classList.remove('is-wrong');
      });
    })();

    // Pointer-following highlight on the glass panel.
    document.querySelectorAll('.tile').forEach(function (tile) {
      tile.addEventListener('mousemove', function (e) {
        var r = tile.getBoundingClientRect();
        tile.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        tile.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
    });
  </script>
  <script src="/cursor.js"></script>
</body>
</html>
