<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q3 2026 LP Report — BlueBrown Partners</title>
  <link rel="icon" type="image/png" href="Images/123.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background-color: #2b2b2b;
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      position: relative;
    }

    body.unlocked {
      background: #fafafa;
      color: #111111;
      height: auto;
      overflow: auto;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.5;
    }

    .grain {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.08;
      animation: grain 0.5s steps(1) infinite;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 200px 200px;
    }

    @keyframes grain {
      0%  { transform: translate(0, 0); }
      10% { transform: translate(-2%, -3%); }
      20% { transform: translate(3%, 2%); }
      30% { transform: translate(-1%, 4%); }
      40% { transform: translate(4%, -1%); }
      50% { transform: translate(-3%, 3%); }
      60% { transform: translate(2%, -4%); }
      70% { transform: translate(-4%, 1%); }
      80% { transform: translate(1%, -2%); }
      90% { transform: translate(3%, 4%); }
      100%{ transform: translate(-2%, -1%); }
    }

    #password-gate {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: transparent;
      z-index: 20000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    #password-gate.hidden {
      display: none;
    }

    .password-box {
      background: rgba(245, 244, 240, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 44px 40px 38px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.28), 0 1px 3px rgba(0,0,0,0.06);
      text-align: center;
      box-sizing: border-box;
    }

    .password-box .lock-icon {
      width: 30px;
      height: 30px;
      margin: 0 auto 16px;
      opacity: 0.7;
    }

    .password-box p {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    .password-box input {
      width: 100%;
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.55);
      color: #1a1a1a;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 16px;
      transition: border-color 0.15s, background 0.15s;
    }

    .password-box input::placeholder {
      color: rgba(26,26,26,0.4);
    }

    .password-box input:focus {
      border-color: rgba(26,26,26,0.4);
      background: rgba(255,255,255,0.8);
    }

    .password-box button {
      width: 100%;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 11px 18px;
      border-radius: 8px;
      border: none;
      background: rgba(26,26,26,0.92);
      color: #f4f1e8;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .password-box button:hover {
      background: #000;
    }

    .password-box button:active {
      transform: scale(0.98);
    }

    .password-box .error {
      color: #b33;
      font-size: 12px;
      margin-top: 12px;
      min-height: 14px;
    }

    /* Plain report layout, matching sukone.com/korea-next-israel.html */
    #plain-report {
      display: none;
      font-family: "Inter", -apple-system, "system-ui", sans-serif;
      background: #fafafa;
      color: #111111;
      padding: 80px 24px;
      box-sizing: border-box;
      min-height: 100vh;
    }

    #plain-report .container {
      max-width: 760px;
      margin: 0 auto;
    }

    #plain-report a.back {
      font-size: 15px;
      font-weight: 400;
      line-height: 22.1px;
      color: #aaaaaa;
      text-decoration: none;
    }

    #plain-report h1 {
      font-size: 40px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: normal;
      color: #1a1a1a;
      margin: 24px 0 0 0;
      text-indent: 0;
    }

    #plain-report p.date {
      font-size: 12px;
      font-weight: 400;
      line-height: 20.4px;
      color: #aaaaaa;
      margin: 40px 0 0 0;
    }

    #plain-report #content h2 {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.28px;
      color: #111111;
      margin: 48px 0 16px 0;
    }

    #plain-report #content h3 {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.28px;
      color: #111111;
      margin: 32px 0 16px 0;
    }

    #plain-report #content p {
      font-size: 17px;
      font-weight: 400;
      line-height: 1.6;
      color: #444444;
      margin: 0 0 20px 0;
    }

    #plain-report #content a {
      color: #444444;
    }

    #plain-report #content img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 8px 0 24px 0;
      display: block;
    }

    #plain-report .quote {
      border-left: 2px solid #e5e5e5;
      padding-left: 16px;
      margin: 0 0 24px 0;
      font-size: 17px;
      line-height: 1.6;
      color: #444444;
      font-style: italic;
    }

    #plain-report .quote .attr {
      display: block;
      margin-top: 8px;
      font-style: normal;
      font-size: 13px;
      color: #999999;
    }

    #plain-report hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 32px 0;
    }
  </style>
</head>
<body>
  <div id="password-gate">
    <div class="password-box">
      <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2"></rect>
        <path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"></path>
      </svg>
      <p>LP Login</p>
      <input type="password" id="password-input" placeholder="enter password" autocomplete="off" />
      <br>
      <button id="password-submit">enter</button>
      <div class="error" id="password-error"></div>
    </div>
  </div>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="flora.mp4" type="video/mp4" />
  </video>
  <div class="grain"></div>

  <div id="plain-report">
    <div class="container">
      <a class="back" href="index.html">&larr; back</a>
      <h1>Q3 2026 LP Report</h1>

      <div id="content">
      </div>
    </div>
  </div>

  <script>
    var LP_PASSWORD = '@2026bluebrown';
    var gate = document.getElementById('password-gate');
    var pwInput = document.getElementById('password-input');
    var pwSubmit = document.getElementById('password-submit');
    var pwError = document.getElementById('password-error');
    var plainReport = document.getElementById('plain-report');

    function tryUnlock() {
      if (pwInput.value === LP_PASSWORD) {
        gate.classList.add('hidden');
        document.body.classList.add('unlocked');
        plainReport.style.display = 'block';
      } else {
        pwError.textContent = 'incorrect password';
        pwInput.value = '';
      }
    }

    pwSubmit.addEventListener('click', tryUnlock);
    pwInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryUnlock();
    });
  </script>
</body>
</html>
